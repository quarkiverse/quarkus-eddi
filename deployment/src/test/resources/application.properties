# Test config — REST client points to WireMock (overridden by test resource)
quarkus.rest-client.eddi.url=http://localhost:${wiremock.port:8089}
quarkus.eddi.url=http://localhost:${wiremock.port:8089}
quarkus.eddi.environment=production

# Disable Dev Services in tests (we use WireMock instead)
quarkus.eddi.devservices.enabled=false

# Health check enabled
quarkus.eddi.health.enabled=true

# Use random test ports to avoid conflicts with running EDDI dev mode
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
